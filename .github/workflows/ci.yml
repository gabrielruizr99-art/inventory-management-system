name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: inventory_management
          POSTGRES_USER: inventory_app
          POSTGRES_PASSWORD: dummy_password_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: dummy_secret_for_ci_tests_only
      DJANGO_DEBUG: False
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: inventory_management
      DB_USER: inventory_app
      DB_PASSWORD: dummy_password_ci
      DB_HOST: 127.0.0.1
      DB_PORT: 5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/dev.txt

    - name: Check Django setup
      run: python manage.py check

    - name: Check pending migrations
      run: python manage.py makemigrations --check --dry-run

    - name: Run Ruff linter
      run: ruff check .

    - name: Run Ruff formatter check
      run: ruff format --check .

    - name: Run tests with coverage
      run: pytest
