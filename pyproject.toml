[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--cov=core --cov=accounts --cov=config --cov=catalog --cov=partners --cov=inventory --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "manage.py",
    "config/asgi.py",
    "config/wsgi.py",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
    ".git",
    ".venv",
    ".env",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "DJ",  # flake8-django
]
ignore = []
